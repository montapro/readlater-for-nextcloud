[build]
  command = "pnpm --filter @readlater/core build && pnpm --filter readlater-mobile export:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/dav/*"
  to = "https://cloud.k11e.de/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
